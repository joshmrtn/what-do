[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "what-do"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "timezonefinder>=6.0",
    "requests>=2.31",
    "rapidfuzz>=3.0",
    "astral>=3.0",
    "google-genai>=1.0",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.9",
    "types-PyYAML",
    "types-requests",
    "types-python-dateutil",
]

# The importable package is `src` itself, rooted at the project directory —
# every module here imports `from src.foo import ...`. Setuptools' src-layout
# autodetection instead puts `src/` on the path and exposes its children as
# top-level packages, which makes `import src.config` fail and breaks both
# console scripts anywhere but the project root.
[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[project.scripts]
what-do = "src.presentation.cli:main"
what-do-run-batch = "src.scheduler:run"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-p tests.tier_plugin -p pytester --strict-markers -m 'not model and not external'"
# Tiers are named for the reason to run a test, not for what it costs.
# `model` and `external` are orthogonal and stack: a Gemini compliance test is both.
markers = [
    "integration: real SQLite and real Ollama embeddings; runs by default, skips loudly without Ollama",
    "model: asserts a model's compliance with our prompts; run when selecting a model, never a gate. Migrates to the bench in #2",
    "external: needs a third-party API and a key; run by hand, never a gate",
]

[tool.mypy]
python_version = "3.11"
strict = true
