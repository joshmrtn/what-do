location:
  latitude: 0.0
  longitude: 0.0
  postal_code: "00000"
  search_radius_miles: 10

venue_discovery:
  categories: [cafe, theater, music_venue, bar, restaurant, museum, park]
  name_match_threshold: 0.92
  address_match_threshold: 0.85
  blocklist_name_match_threshold: 0.80

scraping:
  lookback_days: 30
  # How far ahead an event may start and still be ingested and ranked. Calendar
  # sources expand recurring events over exactly this window, so raising it
  # takes in more and costs more LLM extraction; lowering it truncates feeds
  # that publish further out. Measured: northshorenightout reaches ~39 days, so
  # 30 was cutting it short.
  #
  # There is no matching bound on how long ago an event was *announced*. A
  # concert booked four months ahead is exactly the kind worth knowing about.
  # lookback_days applies to a post's publication date, which calendar sources
  # deliberately never set. The only lower bound is the event being over.
  # 90 as of 2026-08-13, raised from 45. The horizon stopped being the compute
  # lever when `models.extraction_budget_minutes` arrived: cost is bounded by
  # the budget now, work is ordered soonest-first, and a quiet night that does
  # not spend its budget is reach we have already paid the network for.
  #
  # 90 rather than higher because most sources simply do not publish that far
  # out — past a quarter there is realistically nothing to find. Pairs with #23
  # (top N over M days): a deep, cheaply-maintained horizon is what makes
  # spotting something good months out possible at all.
  horizon_days: 90
  max_discovery_depth: 2
  candidate_promotion_threshold: 3

scoring:
  summary_weight: 0.3
  # Applied direction-aware: multiplied when base_score >= 0, divided when it is
  # negative, so a `no` deepens a bad score instead of improving it. Must be
  # strictly positive. See docs/decisions.md.
  match_multipliers:
    yes: 1.5
    maybe: 1.0
    no: 0.5
  min_tags_per_event: 5

  # How many tags an input of a given length can be expected to earn:
  #   expected = tag_confidence_cap * (1 - e^(-chars / tag_confidence_saturation_chars))
  # and tag_confidence = min(1, actual_tags / expected).
  #
  # Fitted 2026-08-12 over 24 real events run through the production prompt:
  # tag counts rise with input length and flatten around five past ~400 chars
  # (R^2 0.57, so the shape is sound and the constants are not).
  #
  # This replaced a fixed `min_tags_per_event` divisor, which asked the same
  # question of a 25-character cinema listing and a 2,000-character festival
  # programme — marking the terse source down for being terse. A one-tag event
  # went from a flat 0.20 to 1.00 at 25 chars, converging on 0.20 only where the
  # input really could have earned more.
  #
  # A heuristic, permanently. Input length is a weak proxy for how much a
  # description actually distinguishes; a long one can honestly earn one tag.
  # It only has to beat a constant. Re-fit as nights accumulate — the values
  # used are recorded per run in run_history.scoring_config.
  tag_confidence_cap: 5.0
  tag_confidence_saturation_chars: 190.0

  # Logistic gate applied to every similarity before it can contribute.
  # Measured with nomic-embed-text: unrelated pairs land at 0.33-0.48 and
  # related pairs at 0.77-0.86, so 0.60 sits between the two distributions.
  # Without this, a coin-flip between two noise values contributes almost its
  # full magnitude — "sushi" scored -0.433 against a dislike list with no food in it.
  gate_midpoint: 0.60
  gate_temperature: 0.04

  # balanced_mean: mean(positives) - mean(|negatives|). Stops several weak
  #   incidental negatives outvoting one strong positive.
  # specificity_sum: sum(contributions) / count — the originally specified
  #   formula, retained for comparison. See docs/decisions.md.
  aggregator: balanced_mean

  match:
    # Advisory yes/maybe/no. `no` is relative, never an absolute dislike cutoff:
    # a karaoke bar scores 0.932 on "bar" against the dislike "bars", so an
    # absolute rule would reject a venue you like. The strongest dislike must
    # beat the strongest like by no_margin.
    yes_min: 0.30
    no_margin: 0.15

  # source_type -> preference domain. Any source_type not listed here gets
  # [general] preferences only, so a [movies] entry never scores a concert.
  domain_map:
    cinema_veezi: movies
    amc: movies

deduplication:
  fuzzy_title_threshold: 0.85
  time_window_hours: 2
  semantic_threshold: 0.92

  # Every comparison the dedup passes make is recorded, not only the merges: a
  # rejection is the label a surviving row can never carry, and it is most of
  # what a future dedup model would learn from.
  #
  # Not all of them, though. Measured on a ~1,670-event corpus, the structural
  # guards cut 1.39M possible pairs to 1,784 actually scored — of which two
  # merged. Keeping every one of those nightly is affordable for a night and
  # not for a year, and they are overwhelmingly the same easy negative again.
  #
  # So: every merge, every rejection at or above the floor, and one in N of the
  # rest. The easy ones are downsampled rather than dropped, because they are
  # the class a model will mostly meet in production.

  # Above the embedding noise floor: the score distribution's mode sits at 0.51
  # and 0.60-0.70 holds 197 pairs, so this catches the tail without the mode.
  decision_floor: 0.70
  # 1 keeps everything. The rate is written onto each row as well as read from
  # here, so a row stays reweightable to true prevalence after this is tuned.
  decision_sample_denominator: 10

# Public ICS calendars to ingest. Many venues and local aggregators publish one,
# and it is a far better source than scraping: structured, forward-looking, and
# free. Adding a calendar is a config entry, not a code change.
#
# source_type defaults to name, and is what domain_map above keys off.
# min_fetch_interval_hours is a politeness floor — re-running the batch by hand
# inside that window reuses the cached feed instead of refetching.
#
# venue/city are for single-venue feeds. An aggregator names the venue in each
# entry; a cinema's own calendar just names the film, so without these every
# event arrives venue-less — costing blocklist matching, dedup, and the CLI's
# `Title — Venue` line. They fill a gap only: an entry that names its own venue
# is more specific and wins.
#
# site_url is where the CLI sends a reader whose event carries no link of its
# own, shown as a `source:` line under the title. Not every listing publishes a
# per-event URL — measured, one aggregator left 320 of its 359 events with none,
# so a mistake in its data arrived with nothing to check it against and read as
# ours. Declare it whenever `url` is a feed rather than a page: an ICS export is
# a correct thing to fetch and a useless thing to hand a person.
#
# It is resolved per source_type, not per feed, because an event records only
# that label. Where several feeds share a source_type they must agree on
# site_url, or no link is offered for any of them — two cinemas behind one
# source_type would otherwise send half the showings to the wrong cinema, and a
# wrong link is worse than none. An event that has its own URL always shows that
# instead, unlabelled, because it opens the event rather than the site.
sources:
  ics_calendars: []
    # - name: example_calendar
    #   url: "https://calendar.google.com/calendar/ical/<id>/public/basic.ics"
    #   site_url: "https://example.com/"
    #   min_fetch_interval_hours: 6
    #   venue: "The Example Cinema"
    #   city: "Gloucester"

  # Date-grouped listing pages, parsed as `TIME - TITLE - VENUE - CITY` lines
  # under `Weekday, Month Day` headings. A site may appear in both lists: a feed
  # usually runs weeks ahead for a few venues, while its listing page covers far
  # more venues but only the days it currently shows. Dedup reconciles the overlap.
  html_calendars: []
    # - name: example_listing
    #   url: "https://example.com/"
    #   min_fetch_interval_hours: 6
    #   # Needed only when `url` is not itself a page worth opening. A listing
    #   # page already is one, so this can be left out here.

  # Veezi public ticketing pages — used by many independent cinemas and needing
  # no credentials. The siteToken appears in the cinema's own booking links, so
  # adding a cinema is a config entry. Set source_type to something mapped to
  # the `movies` preference domain in scoring.domain_map above.
  veezi_cinemas: []
    # - name: example_cinema
    #   url: "https://ticketing.useast.veezi.com/sessions/?siteToken=<token>"
    #   source_type: cinema_veezi
    #   venue: "The Example Cinema"
    #   city: "Salem"
    #   min_fetch_interval_hours: 6

  # The Events Calendar (WordPress) iCal exports. Its export is capped at 30
  # events and ignores `paged`, so these are walked with `tribe-bar-date`.
  # A busy calendar configured under `ics_calendars` instead would silently
  # contribute its first 30 events and look complete.
  tribe_calendars: []
    # - name: example_theatre
    #   url: "https://example.org/events/?ical=1"
    #   venue: "The Example Theatre"
    #   city: "Salem"
    #   min_fetch_interval_hours: 6

  # Paginated `whats-on` listings in The Cabot's markup. Ten events per page,
  # ascending, so paging stops as soon as a page opens past horizon_days rather
  # than walking the whole listing.
  cabot_listings: []
    # - name: example_theatre
    #   url: "https://example.org/whats-on/"
    #   venue: "The Example Theatre"
    #   city: "Beverly"
    #   min_fetch_interval_hours: 6

  # Do617 venue pages. One entry per venue worth watching — the aggregator's
  # date listings would cover the same ground at a request per day of horizon.
  # The schema.org markup states each event's own UTC offset, so nothing here
  # is inferred. A venue the aggregator has no listings for is not an error;
  # it costs one request and starts producing when listings appear.
  #
  # Note how every entry repeats the same site_url. They share one source_type,
  # so they have to agree before the CLI will attribute any of them — see the
  # site_url note above. Omitting it from one entry silences the `source:` line
  # for all of them.
  do617_venues: []
    # - name: do617_example_cafe
    #   url: "https://do617.com/venues/example-cafe"
    #   site_url: "https://do617.com/"
    #   source_type: do617
    #   min_fetch_interval_hours: 6
    # - name: do617_example_bar
    #   url: "https://do617.com/venues/example-bar"
    #   site_url: "https://do617.com/"
    #   source_type: do617
    #   min_fetch_interval_hours: 6

  # Pages publishing schema.org events as JSON-LD. The richest markup a site
  # can offer: real ISO timestamps with offsets, a location, and an explicit
  # eventStatus, so a cancellation is stated rather than guessed from a title.
  # Worth checking for before writing any bespoke HTML parser.
  #
  # The id is the event URL *plus its start*: a recurring programme keeps one
  # page across every date it runs, so the URL alone collapses a season into
  # a single candidate.
  jsonld_pages: []
    # - name: example_museum
    #   url: "https://example.org/events"
    #   source_type: example_museum
    #   city: "Salem"
    #   min_fetch_interval_hours: 6

  # Assabet Interactive calendar feeds, used by many Massachusetts libraries.
  # Its pubDate IS the event start — the opposite of the MOON feed below, where
  # pubDate is when the show was announced. Look for the host behind an
  # <iframe> on the organisation's own calendar page.
  assabet_feeds: []
    # - name: example_library
    #   url: "https://example.assabetinteractive.com/calendar/upcoming-events.rss"
    #   source_type: example_library
    #   city: "Salem"
    #   min_fetch_interval_hours: 6

  # MOON's Squarespace show feed. RSS carries no event date, so this adapter
  # knows one site's convention: the date is in the item title, and pubDate is
  # only when the show was announced. A different RSS venue needs its own
  # RssFeedSource subclass rather than an entry here.
  moon_feeds: []
    # - name: moon
    #   url: "https://www.moon-ns.org/shows?format=rss"
    #   source_type: moon
    #   city: "Salem"
    #   min_fetch_interval_hours: 6

models:
  # How few tags a reply may carry before the extraction counts as failed.
  # NOT scoring.min_tags_per_event, which asks a different question: how much
  # evidence counts as *complete*. One number served both until 2026-08-11, so
  # the only way to stop the model padding was to also declare thin events
  # fully evidenced.
  #
  # Keep this at 1. A floor above the honest answer does not raise quality, it
  # manufactures it: measured, every reply at five returned exactly five tags,
  # never four, never six — and asked for five from a performer's name alone,
  # gemma4:e4b emitted `null_data` and `missing_text` as tags. Those get
  # embedded and scored against your preferences like any real tag.
  min_tags: 1

  # How much model time one run may spend on extraction, in minutes.
  #
  # Extraction is the only stage measured in minutes an *event*, so it is the
  # only one worth bounding. A first run against a 45-day horizon extracts a
  # month and a half in one sitting — measured at 14.9h and 19.7h — and any
  # change to the extraction input re-extracts the whole corpus.
  #
  # Events the budget defers write no hash, so the next run picks them up.
  # Work is ordered soonest-first, which means tonight's events are always
  # done before the backlog however deep it runs — so a bound costs lookahead,
  # never tonight.
  #
  # 300 (5h) leaves a 02:00 batch finished by 07:00. Raise it if you want the
  # horizon to fill in faster; set it to null for no bound at all.
  extraction_budget_minutes: 300

  llm_extraction: "gemma4:e4b"
  llm_disambiguation: "gemma4:e2b"
  embeddings: "nomic-embed-text"

  # Chat request parameters. Every one of these has a default in code, so the
  # whole block can be omitted; it is spelled out because the defaults are not
  # the model's own and the difference is what makes extraction reliable.
  #
  # num_ctx is the important one. Ollama defaults to 4096, and a model that
  # reasons before answering spends that budget thinking, leaving `content`
  # empty and the JSON parse to fail. Sized to survive a model that ignores
  # `think`. Above ~64k a model is looping rather than reasoning.
  num_ctx: 32768
  # gemma4:e4b ships temperature 1 / top_p 0.95 — variety, which is the
  # opposite of what structured extraction wants.
  temperature: 0.2
  top_p: 0.9
  # Advisory. Some models reason regardless, hence the context sizing above.
  think: false
  # Ollama's constrained decoding: makes unparseable output impossible rather
  # than merely discouraged by the prompt. Blank turns it off.
  format: "json"
  # How long a model stays resident after a call. Long enough to stay hot
  # across a stage whose calls are minutes apart, short enough to give the
  # memory back afterwards. Set explicitly because a server configured to keep
  # models alive indefinitely lets one stray call pin gigabytes until restart,
  # and two large models resident at once is how this box starts thrashing.
  # Blank defers to the server default.
  keep_alive: "30m"

weather:
  provider: "open-meteo"

  # Local hour sampled for anything with no start time of its own (synthetic
  # activities, undated events). Judged on a typical evening rather than the
  # daily extreme.
  default_hour: 20

  # How long a cached forecast may be reused before it is refetched. Keep this
  # under 24 hours: an event discovered a week out would otherwise be scored on
  # the forecast issued the day it was found, including on the night it happens.
  cache_ttl_hours: 12

  # How far weather can move a score. Bad weather vetoes harder than good
  # weather promotes: a thunderstorm is close to disqualifying, while a perfect
  # night is a nudge that should not overturn a strong preference match.
  max_positive_adjustment: 0.15
  max_negative_adjustment: 0.25

  air_quality:
    # Separate Open-Meteo endpoint with a much shorter forecast horizon than
    # weather, so readings are often absent. A missing factor is dropped and the
    # remaining weights renormalise — never scored as though the air were bad.
    enabled: true

  # Each factor maps its reading through an asymmetric trapezoid: comfort is
  # +1.0 across the whole `ideal` band, ramps linearly to 0.0 at `zero` and on
  # to -1.0 at `floor`, then clamps. A plateau rather than a peak, because a
  # comfortable range has no single optimum. Every bound is independent, so the
  # two sides can ramp at different rates.
  comfort:
    temperature_f:
      ideal: [20, 65]
      zero: [-15, 78]
      floor: [-40, 95]
      weight: 1.0
    dew_point_f:
      # Meteorological comfort scale: below 55 is dry, above 70 is oppressive.
      ideal: [-99, 55]
      zero: [-99, 65]
      floor: [-99, 75]
      weight: 1.0
    relative_humidity:
      # Correlates heavily with dew point, so it stands in rather than adding a
      # second vote — scored only when dew point is unavailable.
      ideal: [0, 45]
      zero: [0, 70]
      floor: [0, 90]
      weight: 1.0
      fallback_for: dew_point_f
    wind_speed_mph:
      ideal: [0, 10]
      zero: [0, 20]
      floor: [0, 35]
      weight: 0.6
    us_aqi:
      ideal: [0, 50]      # "good"
      zero: [0, 100]      # "moderate" ceiling
      floor: [0, 150]     # "unhealthy for sensitive groups"
      weight: 0.8
    precipitation_mm:
      # A capping factor: excluded from the weighted mean and applied as an
      # upper bound instead, because averaging cannot express "this one factor
      # disqualifies the rest" — a downpour among pleasant readings averages out
      # to a pleasant evening. `weight` is therefore unused here.
      # `supersedes` replaces the categorical rain/snow penalty whenever a
      # reading exists, so intensity decides and rain is never penalised twice.
      ideal: [0, 0.3]
      zero: [0, 2.5]
      floor: [0, 10.0]
      supersedes: [rain, snow]

  # Ceilings on total comfort. Only negative values cap; 0.0 means "no
  # objection", not "no comfort". Thunderstorm is deliberately absolute and is
  # never superseded by precipitation: the hazard is lightning, not millimetres,
  # and a dry thunderstorm would otherwise read as a beautiful evening.
  condition_penalty:
    rain: -0.4
    snow: -0.4
    thunderstorm: -1.0
    overcast: -0.2
    partly_cloudy: 0.0
    clear: 0.0

scheduling:
  run_window_start: "02:00"
  run_window_end: "04:00"
  jitter_minutes: 30

# When one night gives way to the next, for the whole system. Asking at 00:30
# means the night you are still in, so the rollover is a small hour rather than
# midnight. Ingestion uses the same boundary as the CLI: a re-run late in the
# evening must not discard the events still being shown.
# Must be quoted — YAML reads an unquoted `4:00` as the number 240.
# Set to "00:00" for plain calendar-day behaviour.
day_starts_at: "04:00"

data_retention_days: 365

# Synthetic activities are generated when all specified conditions are met.
# `setting` must be indoor, outdoor, or unknown. These bypass LLM extraction, so
# the rule is the only place indoor/outdoor can come from; it defaults to
# "unknown", which earns no weather adjustment in either direction.
# Omit time_window to allow the activity at any time of day.
# time_window supports: "after sunset", "before sunrise", or "anchor_offset to anchor_offset"
# Anchors: sunrise, sunset, dawn, dusk — with optional _plus_Nh or _minus_Nh suffix
synthetic_activities:
  - name: "Evening walk"
    conditions:
      min_temp_f: 45
      max_temp_f: 85
      weather: [clear, partly_cloudy]
      # no time_window — valid any time
    tags: [outdoor, walking, low_key]
    setting: outdoor
    summary: "A pleasant walk around town"

  - name: "Sunset picnic"
    conditions:
      min_temp_f: 65
      weather: [clear]
      time_window: "sunset_minus_2h to sunset_plus_30min"
    tags: [outdoor, picnic, social]
    setting: outdoor
    summary: "A picnic at sunset"

# What a listing looks like. The first three are defaults — `--limit`,
# `--upcoming N` and `-v` each override at the call site — and live here so a
# preference does not have to be retyped every invocation.
view:
  limit: 10             # events shown before the rest are counted
  upcoming_days: 14     # nights after tonight that `--upcoming` covers
  reason_limit: 2       # semantic reasons per event before `--verbose`
  # Candidates `--explain` lists when a selector is ambiguous, before counting
  # the rest. Its own key rather than reusing `limit`, which happens to share
  # the number: that answers how many recommendations to show, this answers how
  # many candidates to choose between.
  match_limit: 10
  # Beyond this many hours a stored span is read as a recurring programme whose
  # daily hours are its own endpoints, rather than one continuous occurrence.
  # A workshop published as "10-14 August, 09:00-12:00" is a single row, so its
  # real hours are only inferrable from the endpoints. Nothing overrides this at
  # the call site, and it is the number most likely to want tuning.
  long_span_hours: 24
